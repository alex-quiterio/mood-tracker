name: Android APK

# Pushes and PRs only run the checks. The APK is built when a GitHub release is
# published, and attached to it. "Run workflow" (any branch) builds a test APK and
# keeps it as a workflow artifact, without a release.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to the release

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail fast, before the long build, if the tag and app.json disagree.
      - name: Check tag matches app version
        if: github.event_name == 'release'
        run: |
          VERSION="$(node -p 'require("./app.json").expo.version')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match app.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Generates android/ from app.json (Continuous Native Generation); it is never committed.
      - run: npx expo prebuild --platform android --no-install

      # Gradle would otherwise download the NDK mid-build with no retry, and a corrupt
      # download fails the whole build ("Archive is not a ZIP archive"). React Native
      # pins the version; install it up front and retry.
      - name: Install NDK
        run: |
          NDK="$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)"
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /dev/null \
              && [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ] && exit 0
            echo "NDK $NDK install failed (attempt $attempt), retrying"
            rm -rf "$ANDROID_HOME/ndk/$NDK"
            sleep 10
          done
          exit 1

      # arm64-v8a only: covers modern phones and skips three extra native builds.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Without these secrets the APK keeps the template's debug signature, which is
      # the same on every build, so new versions still install over old ones.
      - name: Sign with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" android/app/build/outputs/apk/release/app-release.apk
          rm "$RUNNER_TEMP/release.jks"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="mood-tracker-${GITHUB_REF_NAME#v}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber

      - name: Keep the test APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mood-tracker-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
