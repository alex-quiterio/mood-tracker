name: Android APK

# Pushes and PRs only run the checks. The APK is built when a GitHub release is
# published, and attached to it.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to the release

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail fast, before the long build, if the tag and app.json disagree.
      - name: Check tag matches app version
        run: |
          VERSION="$(node -p 'require("./app.json").expo.version')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match app.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Generates android/ from app.json (Continuous Native Generation); it is never committed.
      - run: npx expo prebuild --platform android --no-install

      # arm64-v8a only: covers modern phones and skips three extra native builds.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Without these secrets the APK keeps the template's debug signature, which is
      # the same on every build, so new versions still install over old ones.
      - name: Sign with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" android/app/build/outputs/apk/release/app-release.apk
          rm "$RUNNER_TEMP/release.jks"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="mood-tracker-${GITHUB_REF_NAME#v}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
