plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stepcounter'
version = '0.1.0'

android {
  namespace "expo.modules.stepcounter"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Recording API on mobile: background step recording by Google Play services.
  implementation 'com.google.android.gms:play-services-fitness:21.2.0'
}
